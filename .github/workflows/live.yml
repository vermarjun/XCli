# Live workflow — Tier 3 (e2e) + Tier 4 (stealth-fingerprint) tests.
# Triggered manually only (workflow_dispatch). Never runs in PR CI.
#
# Requirements:
#   - XCLI_LIVE=1 is set (done below).
#   - For the x.com reachability check (Group C in test_stealth_fingerprint.py),
#     a real ~/.xcli/profile must be present. In v1, this is left as a TODO:
#     the profile can be mounted via a GitHub Actions secret (e.g. as a tarball
#     base64-encoded), then extracted before pytest runs. The stealth checks
#     (Groups A + B) will run and pass without auth; only Group C will be
#     skipped if no profile is present.
#
# TODO (Phase 4): mount the profile artifact from a repository secret:
#   - name: Restore xcli profile
#     run: echo "${{ secrets.XCLI_PROFILE_B64 }}" | base64 -d | tar -xz -C ~/.xcli/
#     # Then run: chmod 700 ~/.xcli/profile

name: Live (Tier 3 + Tier 4)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual stealth check"

# No concurrency cancellation — live runs are rare and manual.

jobs:
  live-tests:
    name: Live tests (Python 3.13)
    runs-on: ubuntu-latest
    env:
      XCLI_LIVE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      # Cache Patchright browser binaries
      - name: Cache Patchright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: patchright-live-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            patchright-live-${{ runner.os }}-

      - name: Install Chromium (Patchright)
        run: uv run patchright install chromium --with-deps

      # TODO (Phase 4): restore profile from secret so x.com/home check runs.
      # - name: Restore xcli profile
      #   if: secrets.XCLI_PROFILE_B64 != ''
      #   run: |
      #     mkdir -p ~/.xcli
      #     echo "${{ secrets.XCLI_PROFILE_B64 }}" | base64 -d | tar -xz -C ~/.xcli/
      #     chmod 700 ~/.xcli/profile

      - name: Run Tier 4 stealth fingerprint tests
        run: uv run pytest tests/e2e/test_stealth_fingerprint.py -v

      - name: Run Tier 3 e2e tests (except stealth, already run above)
        run: |
          uv run pytest tests/e2e/ \
            --ignore=tests/e2e/test_stealth_fingerprint.py \
            -v || true
        # || true: Tier 3 tests that need auth (test_feed_live, test_profile_live)
        # will skip gracefully without a profile. Don't fail the workflow.
