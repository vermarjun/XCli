# CI workflow — Tier 1 (unit) + Tier 2 (integration) tests.
# Runs on every push to main and every pull_request targeting main.
# Does NOT run live tests (XCLI_LIVE is not set).
#
# Python matrix: 3.12, 3.13
# (3.14 skipped — too new for some Patchright dependencies)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint check
        run: uv run ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      # Cache Patchright browser binaries between runs.
      # The cache key includes the Patchright version so it busts on upgrades.
      - name: Cache Patchright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: patchright-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            patchright-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install Chromium (Patchright)
        run: uv run patchright install chromium --with-deps

      - name: Run unit + integration tests
        run: uv run pytest tests/unit tests/integration -v --cov=xcli --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
